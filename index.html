<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر Alaa & Marwan Store الفاخر للملابس</title> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style-index.css">
</head>
<body>
<!-- الهيدر الرئيسي -->
<header class="main-header">
    <div class="logo">Alaa & Marwan Store</div>
    <nav class="nav-links">
        <a href="index.html" class="active"><i class="fas fa-store"></i> المتجر</a>
        <a href="checkout.html"><i class="fas fa-credit-card"></i> الدفع والفواتير</a>
        <a href="customer.html" id="customerNavLink" style="display:none;"><i class="fas fa-user"></i> حسابي</a>
        <a href="ad.html" id="adminNavLink" style="display:none;"><i class="fas fa-user-shield"></i> لوحة التحكم</a>
    </nav>
    <div class="header-actions">
        <button id="darkModeToggle" class="btn-dark-mode" aria-label="تبديل الوضع الليلي">
            <i class="fas fa-moon"></i>
        </button>
        <button id="cartToggleBtn" class="btn-cart" aria-label="فتح سلة المشتريات">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge" id="cartBadge">0</span>
        </button>
    </div>
</header>

<div class="login-modal" id="loginModal">
    <div class="login-panel">
        <h2>تسجيل الدخول</h2>
        <p>أدخل بياناتك الصحيحة للوصول إلى الموقع ، أو اختر الدخول كعميل </p>
        <form id="loginForm">
            <label for="loginUser">اسم المستخدم</label>
            <input type="text" id="loginUser" placeholder="اسم المستخدم أو رقم المستخدم" required>
            <label for="loginPass">كلمة المرور</label>
            <input type="password" id="loginPass" placeholder="كلمة المرور مثل 123" required>
            <div class="login-actions">
                <button type="submit" class="login-submit">دخول</button>
                <button type="button" id="guestBtn" class="guest-btn">الدخول كعميل</button>
            </div>
        </form>
    </div>
</div>

    <section class="controls-section">
        <div class="filter-buttons">
            <button class="btn-filter active" data-cat="الكل">الكل</button>
            <button class="btn-filter" data-cat="رجال">رجال</button>
            <button class="btn-filter" data-cat="نساء">نساء</button>
            <button class="btn-filter" data-cat="أطفال">أطفال</button>
            <button class="btn-filter" data-cat="شبابي">شبابي</button>
        </div>
    </section>

    <!-- شبكة عرض المنتجات -->
    <main class="products-grid" id="productsGrid"></main>
    <!-- سلة المشتريات الجانبية --> <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-drawer-header"><h3>سلة التسوق الخاصة بك</h3>
            <button class="btn-close-cart" id="closeCartBtn">&times;</button>
        </div> <div class="cart-drawer-items" id="cartDrawerItems"> </div> 
        <div class="cart-drawer-footer">
            <div class="cart-total-row"><span>المجموع الفرعي:</span><span id="cartSubtotal">$0</span>
            </div>
            <a href="checkout.html" class="btn-checkout-link">الانتقال لإتمام الدفع وشحن الفاتورة</a>
        </div>
    </div>

    <script src="script-index.js"></script>
</body>
</html>
