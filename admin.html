 
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر Alaa & marwan Store الفاخر للملابس</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style-index.css">
</head>
<body>
    <script>
        window.location.replace('ad.html');
    </script>

    <!-- الهيدر الرئيسي -->
    <header class="main-header">
        <div class="logo">Alaa  & marwan Store</div>
        <nav class="nav-links">
            <a href="index.html" class="active"><i class="fas fa-store"></i> المتجر</a>
            <a href="checkout.html"><i class="fas fa-credit-card"></i> الدفع والفواتير</a>
            <a href="customer.html"><i class="fas fa-user"></i> حسابي</a>
            <a href="ad.html"><i class="fas fa-user-shield"></i> لوحة التحكم</a>
        </nav>
        <div class="header-actions">
            <button id="darkModeToggle" class="btn-dark-mode"><i class="fas fa-moon"></i></button>
            <button id="cartToggleBtn" class="btn-cart">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- شريط التحكم والبحث الفوري والفلترة -->
    <section class="controls-section">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن ملابس، جاكيت، فستان...">
        </div>
        <div class="filter-buttons">
            <button class="btn-filter active" data-cat="الكل">الكل</button>
            <button class="btn-filter" data-cat="رجال">رجال</button>
            <button class="btn-filter" data-cat="نساء">نساء</button>
            <button class="btn-filter" data-cat="أطفال">أطفال</button>
        </div>
    </section>

    <!-- شبكة عرض المنتجات -->
    <main class="products-grid" id="productsGrid"></main>

    <!-- سلة المشتريات الجانبية -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-drawer-header">
            <h3>حقيبة التسوق الخاصة بك</h3>
            <button class="btn-close-cart" id="closeCartBtn">&times;</button>
        </div>
        <div class="cart-drawer-items" id="cartDrawerItems"></div>
        <div class="cart-drawer-footer">
            <div class="cart-total-row">
                <span>المجموع الفرعي:</span>
                <span id="cartSubtotal">$0</span>
            </div>
            <a href="checkout.html" class="btn-checkout-link">الانتقال لإتمام الدفع وشحن الفاتورة</a>
        </div>
    </div>

    <script src="script-index.js"></script>
</body>
</html>
